<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Focus Finder</title>
    <link rel="stylesheet" href="settings.css">
</head>
<body>
    <header id="header">Focus Finder</header>
    <main id="content">
        <section>
            <h2 class="setting-label">Trigger shortcut</h2>
            <div class="shortcut-row">
                <div id="shortcut-display" aria-live="polite"></div>
                <button id="record-btn" type="button">Change</button>
            </div>
        </section>
        <p id="hint">Won't trigger when a text field is focused.</p>
    </main>
    <script src="shortcut.js"></script>
    <script src="settings.js"></script>
</body>
</html>
